# Lưới an toàn tự động: test backend + kiểm kiểu frontend cho mỗi lần push/PR.
#
# Vì sao cần: mô hình chấm điểm và quy tắc cắt lỗ là chỗ sai-là-mất-tiền-thật.
# Chạy test bằng tay thì sớm muộn cũng có lần quên.

name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        #  Đúng image dùng ở môi trường thật: cần extension pgvector cho kho RAG.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest
          POSTGRES_DB: phantichma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invest -d phantichma"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      APP_DATABASE_URL: postgresql+psycopg://invest:invest@localhost:5432/phantichma
      APP_RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
      APP_CELERY_BROKER_URL: redis://localhost:6379/0
      APP_CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài phụ thuộc
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Chạy test
        working-directory: backend
        run: pytest tests -q

  frontend:
    name: Frontend · typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci

      - name: Kiểm kiểu
        working-directory: frontend
        run: npm run typecheck
