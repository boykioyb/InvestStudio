# InvestStudio — FastAPI (backend) + Nuxt 3 (frontend), chạy hoàn toàn trong Docker.
#
#   docker compose up --build       → API :8010 · Web :3010
#   Mở http://localhost:3010        → nhập mã cổ phiếu
#   (đổi cổng web: WEB_PORT=4000 docker compose up)
#   Tài liệu API: http://localhost:8010/docs
#   (đổi cổng API: API_PORT=9000 docker compose up)
#
# Kiến trúc: MỘT nguồn sự thật — toàn bộ crawl + chấm điểm nằm ở backend
# (backend/app/services/scoring.py). Frontend chỉ render kết quả API trả về.

services:
  backend:
    build: ./backend
    image: investstudio-backend
    ports:
      - "${API_PORT:-8010}:8000"
    environment:
      # Frontend đi qua proxy cùng origin nên không cần CORS. Danh sách này chỉ
      # dành cho trường hợp bạn gọi thẳng API từ công cụ khác.
      APP_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3010}","http://127.0.0.1:${WEB_PORT:-3010}"]'
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - vnstock-cache:/root/.vnstock   # giữ cache/cfg vnstock giữa các lần chạy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: investstudio-frontend
    ports:
      - "${WEB_PORT:-3010}:3010"
    environment:
      # Trình duyệt gọi /api cùng origin → Nuxt proxy sang backend qua mạng nội bộ.
      # Nhờ vậy mở từ điện thoại/máy khác trong LAN vẫn chạy, và không cần CORS.
      NUXT_API_PROXY_TARGET: http://backend:8000
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vnstock-cache:
