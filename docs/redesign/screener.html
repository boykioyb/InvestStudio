<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InvestStudio — Danh sách</title>
<link rel="stylesheet" href="theme.css">
<style>
.head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head-row h1{font-size:26px;margin:0;font-weight:800}
.baskets{display:flex;gap:7px;flex-wrap:wrap}
.baskets button{border:1px solid var(--line);background:var(--panel-hi);color:var(--muted);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.baskets button:hover{color:var(--text);border-color:var(--line-hi)}
.baskets button.on{color:#04121f;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none}
.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.live{color:var(--good);border:1px solid var(--good);border-radius:20px;padding:3px 10px;font-weight:700;font-size:11px}
.live::before{content:"● ";animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* heat strip */
.heat{display:flex;gap:3px;height:10px;border-radius:6px;overflow:hidden;margin-bottom:16px}
.heat i{flex:1}

.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);backdrop-filter:blur(12px)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{position:sticky;top:0;background:rgba(15,22,38,.95);backdrop-filter:blur(6px);text-align:right;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line-hi)}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--accent)}
tbody td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody td.l{text-align:left;font-family:var(--sans)}
tbody tr{transition:background .12s;cursor:pointer}
tbody tr:hover{background:var(--panel-hi)}
.sym{font-weight:800;color:var(--accent);font-family:var(--sans)}
.nm{color:var(--muted);font-size:12px}
.spk{width:88px;height:26px;vertical-align:middle}
.score{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:8px;font-weight:700;font-size:12.5px}
.s-good{color:var(--good);background:var(--good-glow)} .s-warn{color:var(--warn);background:var(--warn-glow)} .s-bad{color:var(--bad);background:var(--bad-glow)}
.star{color:var(--muted-2);cursor:pointer}.star:hover{color:var(--warn)}
tbody tr{opacity:0;transform:translateX(-8px)}
@media(max-width:820px){.nm,.hide{display:none}}
</style>
</head>
<body>
<div class="aura"></div><div class="grid-bg"></div>

<header class="top">
  <a class="brand" href="home.html"><span class="logo">IS</span> InvestStudio <small>· Terminal</small></a>
  <nav class="tabs">
    <a href="home.html">Home</a><a href="dashboard.html">Phân tích</a>
    <a class="on" href="screener.html">Danh sách</a><a>Theo dõi</a><a>Trợ lý</a>
  </nav>
  <div class="cmdk">🔎 Tìm mã… <kbd>⌘K</kbd></div>
  <div class="avatar">H</div>
</header>

<main class="stage">
  <div class="head-row">
    <h1>Danh sách mã</h1>
    <div class="baskets">
      <button class="on">VN30</button><button>HOSE</button><button>HNX</button>
      <button>Ngân hàng</button><button>Bất động sản</button><button>Công nghệ</button>
    </div>
  </div>
  <div class="meta"><span class="live">TRỰC TIẾP</span> 30 mã · sắp theo Điểm ▼ · phiên 24/08/2026</div>

  <div class="heat" id="heat"></div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th class="l">Mã</th><th class="l hide">Tên</th><th>Giá</th><th>±%</th>
        <th>6 tháng</th><th class="sorted">Điểm ▼</th><th class="hide">RSI</th>
        <th class="hide">P/E</th><th>KLGD</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function spark(dir){const n=18,a=[];let v=50;for(let i=0;i<n;i++){v+=(Math.sin(i)+ (dir>0?.5:-.5))*4+(i%3-1)*2;a.push(v)}
  const w=88,h=26,mn=Math.min(...a),mx=Math.max(...a),X=i=>i/(n-1)*w,Y=x=>h-2-((x-mn)/(mx-mn||1))*(h-4);
  let d='';a.forEach((x,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)+' ');
  const c=dir>0?'#2ee6a6':'#ff5d73';
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.8"/></svg>`;}

// [sym,name,price,chg,score,rsi,pe,vol(tỷ)]
const D=[
 ['FPT','CTCP FPT',132.4,1.65,78,62,18.4,412],
 ['MWG','Thế Giới Di Động',61.2,0.88,74,58,15.2,286],
 ['HPG','Hòa Phát',27.85,2.10,71,66,11.9,540],
 ['MBB','MB Bank',24.3,1.24,69,55,6.8,318],
 ['ACB','Á Châu',26.1,0.42,68,53,7.1,190],
 ['VCB','Vietcombank',92.1,-0.42,66,49,15.0,210],
 ['DGC','Đức Giang',108.5,1.9,64,60,12.4,145],
 ['SSI','SSI Securities',34.7,3.02,61,71,17.8,402],
 ['GAS','PV Gas',78.6,-0.63,58,47,16.1,98],
 ['VNM','Vinamilk',68.0,-0.15,55,44,17.2,132],
 ['VIC','Vingroup',42.1,0.24,48,52,22.9,176],
 ['NVL','Novaland',13.9,-4.2,34,29,8.4,255],
 ['PDR','Phát Đạt',18.4,-3.1,31,33,9.1,120],
];
const cls=s=>s>=65?'s-good':s>=50?'s-warn':'s-bad';
const rows=document.getElementById('rows');
rows.innerHTML=D.map(([s,n,p,c,sc,rsi,pe,vol])=>{const d=c>=0?'up':'down';const ar=c>=0?'▲':'▼';
 return `<tr>
  <td class="l"><span class="sym">${s}</span></td>
  <td class="l nm hide">${n}</td>
  <td>${p.toLocaleString('vi-VN',{minimumFractionDigits:2})}</td>
  <td class="${d}">${ar} ${c>=0?'+':''}${c.toFixed(2)}%</td>
  <td>${spark(c)}</td>
  <td><span class="score ${cls(sc)}">${sc}</span></td>
  <td class="hide">${rsi}</td>
  <td class="hide">${pe.toFixed(1)}</td>
  <td>${vol} tỷ</td>
  <td><span class="star">☆</span></td>
 </tr>`}).join('');

// heat strip theo ±%
document.getElementById('heat').innerHTML=D.map(([,,,c])=>{
  const a=Math.min(1,Math.abs(c)/4);const col=c>=0?`rgba(46,230,166,${.25+a*.6})`:`rgba(255,93,115,${.25+a*.6})`;
  return `<i title="${c}%" style="background:${col}"></i>`}).join('');

// stagger rows in
document.querySelectorAll('tbody tr').forEach((tr,i)=>{setTimeout(()=>{tr.style.transition='opacity .4s,transform .4s';tr.style.opacity=1;tr.style.transform='none'},RM?0:i*45)});
document.querySelectorAll('.star').forEach(s=>s.onclick=e=>{e.stopPropagation();s.textContent=s.textContent==='☆'?'★':'☆';s.style.color=s.textContent==='★'?'var(--warn)':''});
</script>
</body>
</html>
